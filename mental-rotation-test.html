<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mental Rotation Practice</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 1rem/1.45 system-ui, sans-serif; color: #e8eef5; background: #10151d; }
  main { width: min(64rem, 100%); margin: 0 auto; padding: clamp(.75rem, 3vw, 1.75rem); }
  h1 { margin: 0 0 .25rem; font-size: clamp(1.45rem, 5vw, 2rem); }
  p { margin: 0; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; margin: 1rem 0; }
  button, select { min-height: 2.75rem; padding: .45rem .8rem; border: 1px solid #566578; border-radius: .4rem;
    color: inherit; background: #263447; font: inherit; cursor: pointer; }
  button:disabled { cursor: default; opacity: .6; }
  button:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid #fed787; outline-offset: 3px; }
  .board, .answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(.4rem, 2vw, 1rem); }
  figure { margin: 0; min-width: 0; overflow: hidden; border: 1px solid #4d5d71; border-radius: .5rem; }
  canvas { display: block; width: 100%; aspect-ratio: 1.25; background: #f3f6fa; }
  figcaption { padding: .5rem; text-align: center; background: #1a2331; }
  .answers { margin-top: .75rem; }
  .answers button { min-width: 0; }
  button[data-outcome=correct] { opacity: 1; border-color: #78e1ae; }
  button[data-outcome=incorrect] { opacity: 1; border-color: #ff9d93; }
  .result { min-height: 2.8rem; margin: .75rem 0; }
  .summary { font-size: .9rem; color: #c4d0dd; }
  .session { display: flex; align-items: center; flex-wrap: wrap; gap: .5rem 1rem; margin-top: .5rem; }
  .meta { margin-top: 1rem; font-size: .86rem; color: #c4d0dd; }
  a { color: #b7daff; }
  @media (max-width: 400px) {
    .controls { gap: .4rem .6rem; margin: .7rem 0; }
    .answers button { padding-inline: .35rem; font-size: .9rem; }
  }
</style>
</head>
<body>
<main>
  <h1>Mental Rotation Practice</h1>
  <p>Same shape rotated, or a mirror image?</p>

  <div class="controls">
    <label for="level">Difficulty</label>
    <select id="level" aria-describedby="level-angles">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <span id="level-angles" class="summary"></span>
  </div>

  <div class="board">
    <figure>
      <canvas id="reference" aria-label="Reference block figure"></canvas>
      <figcaption>Reference</figcaption>
    </figure>
    <figure>
      <canvas id="comparison" aria-label="Comparison block figure"></canvas>
      <figcaption>Comparison</figcaption>
    </figure>
  </div>
  <div class="answers" role="group" aria-label="Answer choices">
    <button id="same" disabled>Same shape (1)</button>
    <button id="mirror" disabled>Mirror image (2)</button>
  </div>
  <p class="result" id="feedback" role="status">Loading figures…</p>
  <button id="next" hidden>Next trial</button>
  <div class="session">
    <p class="summary" id="stats">0 answered · Accuracy — · Median correct time —</p>
    <button id="reset">Reset session</button>
  </div>
  <p class="meta">Practice task based on static block figures and angular disparity. The difficulty bands are practice settings and have no normative scores. <a href="https://doi.org/10.1126/science.171.3972.701">Shepard &amp; Metzler (1971)</a></p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

const levels = {
  easy: [20, 40, 60],
  medium: [80, 100, 120],
  hard: [140, 160, 180],
};

function shuffle(items) {
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  return items;
}

// Signed axis permutations with determinant +1 are the 24 rotations of the cube.
const permutations = [
  [0, 1, 2], [1, 2, 0], [2, 0, 1], [0, 2, 1], [2, 1, 0], [1, 0, 2],
];
const rotations = permutations.flatMap((axes, index) => [-1, 1].flatMap(sx => [-1, 1].map(sy => {
  const sz = (index < 3 ? 1 : -1) * sx * sy;
  return ([x, y, z]) => {
    const point = [x, y, z];
    return [sx * point[axes[0]], sy * point[axes[1]], sz * point[axes[2]]];
  };
})));

function canonical(cells) {
  return rotations.map(rotate => {
    const turned = cells.map(rotate);
    const origin = [0, 1, 2].map(axis => Math.min(...turned.map(cell => cell[axis])));
    return turned.map(p => p.map((value, axis) => value - origin[axis]).join(',')).sort().join(';');
  }).sort()[0];
}

function reflect(cells) {
  return cells.map(([x, y, z]) => [-x, y, z]);
}

function buildPath(lengths, axes, signs) {
  const cells = [[0, 0, 0]];
  lengths.forEach((length, leg) => {
    for (let step = 0; step < length; step++) {
      const point = cells[cells.length - 1].slice();
      point[axes[leg]] += signs[leg];
      cells.push(point);
    }
  });
  return cells;
}

function hasExtraContacts(cells) {
  for (let i = 2; i < cells.length; i++) {
    for (let j = 0; j < i - 1; j++) {
      const distance = cells[i].reduce((sum, value, axis) => sum + Math.abs(value - cells[j][axis]), 0);
      if (distance <= 1) return true;
    }
  }
  return false;
}

function makeShape() {
  for (let attempt = 0; attempt < 80; attempt++) {
    // Nine unit steps, four straight runs, three turns, and no extra face contacts.
    const lengths = [1, 1, 1, 1];
    for (let step = 0; step < 5; step++) lengths[Math.floor(Math.random() * 4)]++;
    const axes = shuffle([0, 1, 2]);
    const repeatedAxis = Math.random() < 0.5 ? axes[0] : axes[1];
    axes.push(repeatedAxis);
    const cells = buildPath(lengths, axes, axes.map(() => Math.random() < 0.5 ? -1 : 1));
    if (!hasExtraContacts(cells) && canonical(cells) !== canonical(reflect(cells))) return cells;
  }
  return buildPath([3, 2, 3, 1], [0, 1, 2, 0], [1, 1, 1, -1]);
}

function makeBlock(level) {
  return shuffle(levels[level].flatMap(degrees => [false, true].flatMap(mirror =>
    ['screen', 'depth'].map(axis => ({ degrees, mirror, axis }))
  )));
}

const statsEl = document.getElementById('stats');
const levelSelect = document.getElementById('level');
const anglesEl = document.getElementById('level-angles');
const feedback = document.getElementById('feedback');
const sameButton = document.getElementById('same');
const mirrorButton = document.getElementById('mirror');
const nextButton = document.getElementById('next');
const resetButton = document.getElementById('reset');
const canvases = [document.getElementById('reference'), document.getElementById('comparison')];
const contexts = canvases.map(canvas => canvas.getContext('2d'));

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch {
  feedback.textContent = 'The figures could not load. Check your connection and WebGL support, then reload.';
  levelSelect.disabled = resetButton.disabled = true;
  throw new Error('Could not initialize the mental rotation renderer');
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3f6fa);
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 60);
camera.position.z = 20;
scene.add(new THREE.AmbientLight(0xffffff, 0.62));
const light = new THREE.DirectionalLight(0xffffff, 0.7);
light.position.set(-4, 6, 8);
scene.add(light);
const shapeGroup = new THREE.Group();
scene.add(shapeGroup);
const box = new THREE.BoxGeometry(0.98, 0.98, 0.98);
const boxEdges = new THREE.EdgesGeometry(box);
const surface = new THREE.MeshLambertMaterial({ color: 0x7195c1 });
const edge = new THREE.LineBasicMaterial({ color: 0x253951 });
const cubes = Array.from({ length: 10 }, () => {
  const cube = new THREE.Mesh(box, surface);
  cube.add(new THREE.LineSegments(boxEdges, edge));
  shapeGroup.add(cube);
  return cube;
});
const unitAxes = [
  new THREE.Vector3(1, 0, 0),
  new THREE.Vector3(0, 1, 0),
  new THREE.Vector3(0, 0, 1),
];
const boxCorners = [-0.49, 0.49].flatMap(x => [-0.49, 0.49].flatMap(y => [-0.49, 0.49].map(z =>
  new THREE.Vector3(x, y, z)
)));

function randomOrientation() {
  // Uniform unit quaternion from three independent uniform variates.
  const u = Math.random(), a = 2 * Math.PI * Math.random(), b = 2 * Math.PI * Math.random();
  return new THREE.Quaternion(
    Math.sqrt(1 - u) * Math.sin(a), Math.sqrt(1 - u) * Math.cos(a),
    Math.sqrt(u) * Math.sin(b), Math.sqrt(u) * Math.cos(b)
  );
}

function viewScore(cells, orientation) {
  const axes = unitAxes.map(axis => axis.clone().applyQuaternion(orientation));
  // Each camera-axis component is the projected area of one pair of grid axes.
  // Also penalize cubes whose projected centers nearly coincide.
  const separation = Math.min(...axes.map(axis => Math.abs(axis.z)));
  const points = cells.map(p => new THREE.Vector3(...p).applyQuaternion(orientation));
  let obscured = 0;
  for (let i = 0; i < points.length; i++) {
    if (points.some((other, j) => (
      j !== i && other.z > points[i].z &&
      Math.hypot(other.x - points[i].x, other.y - points[i].y) < 0.62
    ))) obscured++;
  }
  return separation - 0.16 * obscured;
}

function pickViews(a, b, trial) {
  const angle = THREE.MathUtils.degToRad(trial.degrees) * (Math.random() < 0.5 ? -1 : 1);
  let best, bestScore = -Infinity;
  // Retain the exact angular disparity while favoring readable projections in both cards.
  for (let i = 0; i < 36; i++) {
    const orientation = randomOrientation();
    const azimuth = Math.random() * Math.PI;
    const axis = trial.axis === 'screen' ? unitAxes[2] : new THREE.Vector3(Math.cos(azimuth), Math.sin(azimuth), 0);
    const relative = new THREE.Quaternion().setFromAxisAngle(axis, angle);
    const other = relative.multiply(orientation);
    const score = Math.min(viewScore(a, orientation), viewScore(b, other));
    if (score > bestScore) {
      bestScore = score;
      best = [orientation, other];
    }
  }
  return best;
}

function makeFigure(cells, orientation) {
  const center = cells.reduce((sum, p) => sum.add(new THREE.Vector3(...p)), new THREE.Vector3())
    .divideScalar(cells.length);
  const points = cells.map(p => new THREE.Vector3(...p).sub(center));
  const bounds = new THREE.Box2();
  for (const point of points) {
    for (const corner of boxCorners) {
      const p = corner.clone().add(point).applyQuaternion(orientation);
      bounds.expandByPoint(new THREE.Vector2(p.x, p.y));
    }
  }
  return { points, orientation, center: bounds.getCenter(new THREE.Vector2()), size: bounds.getSize(new THREE.Vector2()) };
}

let deck = [];
let trial;
let answered = 0;
let correctTimes = [];

function resizeAndRender() {
  if (!trial) return;
  // Shared world-units-per-pixel for both figures, with room for the complete silhouette.
  const dimensions = canvases.map(canvas => ({ width: canvas.clientWidth, height: canvas.clientHeight }));
  if (dimensions.some(({ width, height }) => !width || !height)) return;
  const scale = 0.84 * Math.min(...trial.figures.map(({ size }, i) =>
    Math.min(dimensions[i].width / size.x, dimensions[i].height / size.y)
  ));
  const density = Math.min(window.devicePixelRatio || 1, 2);

  trial.figures.forEach((figure, i) => {
    const { width, height } = dimensions[i];
    const canvas = canvases[i];
    canvas.width = Math.round(width * density);
    canvas.height = Math.round(height * density);
    renderer.setSize(canvas.width, canvas.height, false);
    const halfWidth = width / (2 * scale);
    const halfHeight = height / (2 * scale);
    camera.left = figure.center.x - halfWidth;
    camera.right = figure.center.x + halfWidth;
    camera.bottom = figure.center.y - halfHeight;
    camera.top = figure.center.y + halfHeight;
    camera.updateProjectionMatrix();
    shapeGroup.quaternion.copy(figure.orientation);
    figure.points.forEach((point, index) => cubes[index].position.copy(point));
    renderer.render(scene, camera);
    contexts[i].drawImage(renderer.domElement, 0, 0);
  });
}

const observer = new ResizeObserver(resizeAndRender);
canvases.forEach(canvas => observer.observe(canvas));
window.addEventListener('resize', resizeAndRender);

function startTrial() {
  if (deck.length === 0) deck = makeBlock(levelSelect.value);
  const condition = deck.pop();
  const reference = makeShape();
  const comparison = condition.mirror ? reflect(reference) : reference;
  const [first, second] = pickViews(reference, comparison, condition);
  trial = {
    ...condition,
    figures: [makeFigure(reference, first), makeFigure(comparison, second)],
    answered: false,
  };
  sameButton.disabled = mirrorButton.disabled = false;
  delete sameButton.dataset.outcome;
  delete mirrorButton.dataset.outcome;
  nextButton.hidden = true;
  feedback.textContent = 'Select the relationship between the figures.';
  resizeAndRender();
  trial.started = performance.now();
}

function updateStats() {
  const times = [...correctTimes].sort((a, b) => a - b);
  const middle = Math.floor(times.length / 2);
  const median = times.length % 2 ? times[middle] : (times[middle - 1] + times[middle]) / 2;
  const accuracy = answered ? `${Math.round(100 * times.length / answered)}%` : '—';
  statsEl.textContent = `${answered} answered · Accuracy ${accuracy} · Median correct time ${times.length ? median.toFixed(2) + ' s' : '—'}`;
}

function answer(mirror) {
  if (trial.answered) return;
  const seconds = (performance.now() - trial.started) / 1000;
  trial.answered = true;
  answered++;
  const correct = mirror === trial.mirror;
  if (correct) correctTimes.push(seconds);
  (trial.mirror ? mirrorButton : sameButton).dataset.outcome = 'correct';
  if (!correct) (mirror ? mirrorButton : sameButton).dataset.outcome = 'incorrect';
  sameButton.disabled = mirrorButton.disabled = true;
  const relationship = trial.mirror ? 'Mirror image' : 'Same shape';
  const plane = trial.axis === 'screen' ? 'screen-plane rotation' : 'rotation in depth';
  feedback.textContent = `${correct ? 'Correct' : 'Incorrect'}. ${relationship} · ${trial.degrees}° ${plane} · ${seconds.toFixed(2)} s`;
  updateStats();
  nextButton.hidden = false;
  nextButton.focus();
}

function reset() {
  const angles = levels[levelSelect.value];
  anglesEl.textContent = `${angles[0]}–${angles[angles.length - 1]}° between views`;
  answered = 0;
  correctTimes = [];
  deck = [];
  updateStats();
  startTrial();
}

sameButton.addEventListener('click', () => answer(false));
mirrorButton.addEventListener('click', () => answer(true));
nextButton.addEventListener('click', () => {
  startTrial();
  sameButton.focus();
});
resetButton.addEventListener('click', reset);
levelSelect.addEventListener('change', reset);
window.addEventListener('keydown', event => {
  if (event.repeat || trial.answered || /^(INPUT|SELECT|TEXTAREA)$/.test(event.target.tagName)) return;
  if (event.key === '1' || event.key === '2') answer(event.key === '2');
});
reset();
</script>
</body>
</html>
