<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Differential Simulation</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #111; color: #f5f6f7; font: 15px system-ui, sans-serif; }
        .demo { display: grid; min-height: 100vh; min-height: 100dvh; grid-template-rows: auto minmax(15rem, 1fr) auto; }
        #info { text-align: center; padding: .8rem 1rem; }
        #stage { position: relative; min-width: 0; overflow: hidden; background: #1a1a1a; }
        #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        #controls { width: min(100%, 48rem); margin-inline: auto; padding: 1rem; display: grid; gap: .85rem; }
        .control-row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
        .speed-row { display: grid; grid-template-columns: minmax(5rem, 1fr) minmax(5rem, 2fr) 5.25rem; }
        button, select, input[type=number] {
            font: inherit; color: inherit; background: #21262d; border: 1px solid #484e57;
            border-radius: 6px; padding: .45rem .65rem;
        }
        button, select { cursor: pointer; }
        button[aria-pressed=true] { border-color: #ffc45b; background: #322817; }
        label { min-width: 0; }
        input[type=range] { width: 100%; min-width: 0; accent-color: #ffc45b; }
        output { font: 600 1rem ui-monospace, monospace; color: #ffcf78; }
        .readouts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .65rem; }
        .readouts div { display: grid; gap: .25rem; padding: .55rem; background: #202124; border-radius: 6px; }
        h1 { margin: 0 0 .25rem; font-size: clamp(1.1rem, 3vw, 1.4rem); color: #ffc45b; }
        p { margin: 0; font-size: .875rem; color: #c9cbd0; }
        #status { min-height: 2.5em; }
    </style>
    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <main class="demo">
        <header id="info">
            <h1>Automotive Differential</h1>
            <p>Left wheel RPM + right wheel RPM = 2 × carrier RPM</p>
        </header>
        <div id="stage" aria-label="3D differential model"></div>
        <section id="controls" aria-label="Differential controls">
            <div class="control-row" role="group" aria-label="Driving mode">
                <button id="modeStraight" aria-pressed="true">Straight drive</button>
                <button id="modeTurn" aria-pressed="false">Turning</button>
                <button id="modeSlip" aria-pressed="false">Left wheel stopped</button>
            </div>
            <div class="control-row speed-row">
                <label for="speedRange">Carrier RPM</label>
                <input type="range" id="speedRange" min="0" max="3000" step="1" value="1000">
                <input type="number" id="speedNumber" aria-label="Exact carrier RPM" min="0" max="3000" step="1" value="1000">
            </div>
            <div class="control-row">
                <label for="playbackRate">Animation speed</label>
                <select id="playbackRate">
                    <option value="0.005">1/200×</option>
                    <option value="0.02" selected>1/50×</option>
                    <option value="0.1">1/10×</option>
                    <option value="1">Real time</option>
                </select>
                <button id="pause">Pause</button>
            </div>
            <div class="readouts" aria-label="Model speeds">
                <div>Left wheel <output id="leftRPM">1,000</output></div>
                <div>Carrier <output id="rpmValue">1,000</output></div>
                <div>Right wheel <output id="rightRPM">1,000</output></div>
            </div>
            <p id="status" role="status">Both wheels turn at the carrier speed.</p>
        </section>
    </main>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration ---
        const CONFIG = {
            ringGearTeeth: 40,
            spiderGearTeeth: 12,
            sideGearTeeth: 20, // Must match ratio: Ring/Spider != Side/Spider usually, but for visual sim we simplify
            carrierRadius: 2.5,
            gearThickness: 0.6
        };

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        scene.fog = new THREE.Fog(0x1a1a1a, 10, 50);

        const stage = document.getElementById('stage');
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
        camera.position.set(10, 7, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        stage.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);
        
        const pointLight = new THREE.PointLight(0x4444ff, 0.5);
        pointLight.position.set(0, 0, 0);
        scene.add(pointLight);

        // --- Materials ---
        const matSteel = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.42, metalness: 0.45 });
        const matGold = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.4, metalness: 0.6 }); // Spider gears
        const matDark = new THREE.MeshStandardMaterial({ color: 0x4e535d, roughness: 0.54, metalness: 0.38 });
        const matRed = new THREE.MeshStandardMaterial({ color: 0xcc0000, roughness: 0.3, metalness: 0.5 });

        // --- Helper: Create Gear ---
        function createGear(teeth, radius, thickness, colorMat, holeRadius = 0) {
            const shape = new THREE.Shape();
            const outerRadius = radius;
            const innerRadius = radius * 0.85; // Root radius approx
            const hole = holeRadius > 0 ? holeRadius : 0;

            // Simple gear profile approximation
            for (let i = 0; i < teeth; i++) {
                const angle = (i / teeth) * Math.PI * 2;
                const nextAngle = ((i + 1) / teeth) * Math.PI * 2;
                const midAngle = (angle + nextAngle) / 2;
                
                // Tooth tip
                shape.lineTo(Math.cos(angle) * outerRadius, Math.sin(angle) * outerRadius);
                // Tooth side
                shape.lineTo(Math.cos(midAngle - 0.05) * outerRadius, Math.sin(midAngle - 0.05) * outerRadius);
                shape.lineTo(Math.cos(midAngle + 0.05) * outerRadius, Math.sin(midAngle + 0.05) * outerRadius);
                // Next valley
                shape.lineTo(Math.cos(nextAngle) * innerRadius, Math.sin(nextAngle) * innerRadius);
            }
            shape.closePath();

            if (hole > 0) {
                const holePath = new THREE.Path();
                holePath.absarc(0, 0, hole, 0, Math.PI * 2, true);
                shape.holes.push(holePath);
            }

            const extrudeSettings = { depth: thickness, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.05, bevelThickness: 0.05 };
            const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geometry.center(); // Center geometry
            const mesh = new THREE.Mesh(geometry, colorMat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }

        function createCylinder(radius, height, colorMat) {
            const geo = new THREE.CylinderGeometry(radius, radius, height, 32);
            const mesh = new THREE.Mesh(geo, colorMat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }

        // --- Build Differential Assembly ---

        const diffGroup = new THREE.Group();
        scene.add(diffGroup);

        // 1. Input Shaft & Pinion (Simplified visual)
        const pinionShaft = createCylinder(0.4, 4, matSteel);
        pinionShaft.rotation.z = Math.PI / 2;
        pinionShaft.position.x = -4;
        diffGroup.add(pinionShaft);

        const pinionGear = createGear(12, 1.2, 0.8, matSteel, 0.4);
        pinionGear.rotation.x = Math.PI / 2;
        pinionGear.position.x = -2.5;
        diffGroup.add(pinionGear);

        // 2. Ring Gear (Large driven gear)
        // We will attach this to the Carrier
        const ringGearRadius = 3.5;
        const ringGear = createGear(CONFIG.ringGearTeeth, ringGearRadius, 0.8, matSteel, 2.0);
        ringGear.rotation.x = Math.PI / 2; // Face forward
        
        // 3. Differential Carrier (The housing that holds spider gears)
        const carrierGroup = new THREE.Group();
        diffGroup.add(carrierGroup);

        // Carrier Visuals (Box-like structure holding the cross pin)
        const carrierBox = createCylinder(2.8, 1.0, matDark);
        carrierBox.rotation.x = Math.PI / 2;
        carrierGroup.add(carrierBox);
        
        // Add Ring Gear to Carrier
        ringGear.position.z = 0.6; // Offset slightly
        carrierGroup.add(ringGear);

        // Cross Pin (holds spider gears)
        const crossPin = createCylinder(0.3, 2.5, matSteel);
        crossPin.rotation.x = Math.PI / 2; // Aligned with axle axis initially? No, perpendicular to input
        // Actually, cross pin is perpendicular to the axle shafts. 
        // Axles are X-axis. Input is Z-axis (via ring gear). Cross pin is Y-axis? 
        // Standard diff: Input turns Ring Gear. Ring Gear turns Carrier. 
        // Carrier rotates around X-axis (axle axis). 
        // Wait, Ring Gear rotates around X-axis. So Carrier rotates around X-axis.
        // Spider gears are mounted on a pin inside the carrier. The pin is perpendicular to X. Let's say Y or Z.
        // Let's make the pin along the Z axis for visualization clarity? 
        // No, usually the spider gears rotate on an axis perpendicular to the axle.
        // If Axles are X, Carrier rotates around X. Spider pin is usually Y or Z. Let's use Y.
        
        const spiderPinGeo = new THREE.CylinderGeometry(0.2, 0.2, 2.2, 16);
        spiderPinGeo.rotateZ(Math.PI / 2); // Align along Y
        const spiderPin = new THREE.Mesh(spiderPinGeo, matSteel);
        carrierGroup.add(spiderPin);

        // 4. Spider Gears (The small gears that rotate on the pin)
        const spiderGearRadius = 0.8;
        const spiderGear1 = createGear(CONFIG.spiderGearTeeth, spiderGearRadius, 0.6, matGold, 0.2);
        const spiderGear2 = createGear(CONFIG.spiderGearTeeth, spiderGearRadius, 0.6, matGold, 0.2);
        
        spiderGear1.position.y = -0.6;
        spiderGear2.position.y = 0.6;
        // Initial rotation to mesh? They are bevel gears in reality, but we use spur for simple visual demo of rotation logic
        // To make them look like bevel gears would require complex geometry. 
        // We will simulate the *motion* of bevel gears using standard gears rotated 90deg visually or just accept the abstraction.
        // Better: Rotate them 45 deg to hint at bevel? No, let's just rotate the mesh to face the side gears.
        // Side gears are on X axis. Spider gears on Y axis. They mesh.
        spiderGear1.rotation.x = Math.PI / 2; // Face X axis
        spiderGear2.rotation.x = Math.PI / 2;

        carrierGroup.add(spiderGear1);
        carrierGroup.add(spiderGear2);

        // 5. Side Gears (Connected to Axles)
        const sideGearRadius = 1.5;
        const leftSideGear = createGear(CONFIG.sideGearTeeth, sideGearRadius, 0.6, matSteel, 0.5);
        const rightSideGear = createGear(CONFIG.sideGearTeeth, sideGearRadius, 0.6, matSteel, 0.5);

        leftSideGear.rotation.y = Math.PI / 2; // Face Y? No, face Z? 
        // Axles are along X. Side gears must face the spider gears (which are on Y axis inside carrier).
        // So Side gears plane is YZ. Normal is X.
        leftSideGear.rotation.y = Math.PI / 2; 
        rightSideGear.rotation.y = Math.PI / 2;

        leftSideGear.position.x = -1.2;
        rightSideGear.position.x = 1.2;

        carrierGroup.add(leftSideGear);
        carrierGroup.add(rightSideGear);

        // 6. Axle Shafts
        const axleGeo = new THREE.CylinderGeometry(0.5, 0.5, 4, 16);
        axleGeo.rotateZ(Math.PI / 2);
        
        const leftAxle = new THREE.Mesh(axleGeo, matSteel);
        leftAxle.position.x = -3.5;
        // We need a pivot group for the axle to rotate independently of the carrier
        const leftAxlePivot = new THREE.Group();
        leftAxlePivot.add(leftAxle);
        // Add a wheel visual
        const wheelL = createCylinder(1.5, 0.8, matRed);
        wheelL.rotation.z = Math.PI / 2;
        wheelL.position.x = -2;
        leftAxle.add(wheelL);
        
        const rightAxle = new THREE.Mesh(axleGeo, matSteel);
        rightAxle.position.x = 3.5;
        const rightAxlePivot = new THREE.Group();
        rightAxlePivot.add(rightAxle);
        const wheelR = createCylinder(1.5, 0.8, matRed);
        wheelR.rotation.z = Math.PI / 2;
        wheelR.position.x = 2;
        const markerGeometry = new THREE.BoxGeometry(0.48, 0.045, 0.15);
        const markerMaterial = new THREE.MeshBasicMaterial({ color: 0xffcf78 });
        for (const wheel of [wheelL, wheelR]) {
            for (const y of [-0.41, 0.41]) {
                const marker = new THREE.Mesh(markerGeometry, markerMaterial);
                marker.position.set(1.1, y, 0);
                wheel.add(marker);
            }
        }
        rightAxle.add(wheelR);

        scene.add(leftAxlePivot);
        scene.add(rightAxlePivot);

        // Align pivots with side gears
        leftAxlePivot.position.x = -1.2;
        rightAxlePivot.position.x = 1.2;

        const modeSettings = {
            modeStraight: { split: 0, description: 'Both wheels turn at the carrier speed.' },
            modeTurn: { split: 0.4, description: 'The left wheel slows down and the right wheel speeds up.' },
            modeSlip: { split: 1, description: 'The left wheel stops and the right wheel turns at twice the carrier speed.' },
        };
        const speedInput = document.getElementById('speedRange');
        const speedNumber = document.getElementById('speedNumber');
        const playback = document.getElementById('playbackRate');
        const pauseButton = document.getElementById('pause');
        const speedFormat = new Intl.NumberFormat(undefined, { maximumFractionDigits: 1 });
        let mode = modeSettings.modeStraight;
        let rpm = Number(speedInput.value);
        let leftRPM = rpm, rightRPM = rpm;
        let paused = false;
        let carrierAngle = 0, leftAngle = 0, rightAngle = 0, spiderAngle = 0;
        const clock = new THREE.Clock();
        const radiansPerRpm = 2 * Math.PI / 60;

        function updateSpeeds() {
            const offset = rpm * mode.split;
            leftRPM = rpm - offset;
            rightRPM = rpm + offset;
            for (const [id, value] of [['leftRPM', leftRPM], ['rpmValue', rpm], ['rightRPM', rightRPM]]) {
                document.getElementById(id).textContent = speedFormat.format(value);
            }
        }

        function setRPM(value) {
            rpm = Math.min(Number(speedInput.max), Math.max(Number(speedInput.min), Math.round(value)));
            speedInput.value = speedNumber.value = rpm;
            updateSpeeds();
        }

        for (const [id, settings] of Object.entries(modeSettings)) {
            document.getElementById(id).addEventListener('click', () => {
                mode = settings;
                for (const buttonId of Object.keys(modeSettings)) {
                    document.getElementById(buttonId).setAttribute('aria-pressed', buttonId === id);
                }
                document.getElementById('status').textContent = settings.description;
                updateSpeeds();
            });
        }
        speedInput.addEventListener('input', () => setRPM(speedInput.valueAsNumber));
        speedNumber.addEventListener('input', () => {
            if (speedNumber.validity.valid && Number.isFinite(speedNumber.valueAsNumber)) setRPM(speedNumber.valueAsNumber);
        });
        speedNumber.addEventListener('change', () => setRPM(Number.isFinite(speedNumber.valueAsNumber) ? speedNumber.valueAsNumber : rpm));
        pauseButton.addEventListener('click', () => {
            paused = !paused;
            pauseButton.textContent = paused ? 'Resume' : 'Pause';
        });

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            if (!paused) {
                const anglePerRpm = dt * Number(playback.value) * radiansPerRpm;
                carrierAngle += rpm * anglePerRpm;
                leftAngle += leftRPM * anglePerRpm;
                rightAngle += rightRPM * anglePerRpm;
                const sideGearRPM = rightRPM - rpm;
                spiderAngle += sideGearRPM * CONFIG.sideGearTeeth / CONFIG.spiderGearTeeth * anglePerRpm;
                carrierGroup.rotation.x = carrierAngle;
                leftAxlePivot.rotation.x = leftAngle;
                rightAxlePivot.rotation.x = rightAngle;
                leftSideGear.rotation.x = leftAngle - carrierAngle;
                rightSideGear.rotation.x = rightAngle - carrierAngle;
                spiderGear1.rotation.z = spiderAngle;
                spiderGear2.rotation.z = -spiderAngle;
            }
            controls.update();
            renderer.render(scene, camera);
        }

        function resize() {
            const width = stage.clientWidth, height = stage.clientHeight;
            if (!width || !height) return;
            camera.aspect = width / height;
            camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(Math.PI / 8) / Math.min(1, camera.aspect)));
            camera.updateProjectionMatrix();
            renderer.setSize(width, height, false);
        }
        new ResizeObserver(resize).observe(stage);
        resize();
        updateSpeeds();
        animate();
    </script>
</body>
</html>
